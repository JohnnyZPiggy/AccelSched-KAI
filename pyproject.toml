[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "accelsched-kai"
version = "0.1.0"
description = "CPU-only offline KAI-like scheduling advisor PoC-0"
requires-python = ">=3.10"
dependencies = ["accelsched==1.0.0", "numpy>=1.23", "scipy>=1.9"]

[project.scripts]
accelsched-kai = "accelsched_kai.advisor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
